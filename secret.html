<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀 메모장</title>
<style>
  :root {
    --bg: #f5f3fa;
    --card: #ffffff;
    --accent: #cdbde8;
    --text: #423d4d;
    --line: #e8e2f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    max-width: 30rem;
    margin: 0 auto;
    background: var(--card);
    border-radius: 1.25rem;
    padding: 1.75rem;
    box-shadow: 0 0.5rem 1.5rem rgba(150, 135, 175, 0.15);
  }
  h1 { margin: 0 0 1.25rem; font-size: 1.4rem; }
  form { display: flex; gap: 0.5rem; }
  input, textarea {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    font: inherit;
    color: inherit;
    background: var(--bg);
  }
  textarea { resize: vertical; min-height: 4.5rem; width: 100%; }
  button {
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 0.75rem;
    background: var(--accent);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.96); }
  .memo {
    padding: 0.8rem 1rem;
    margin-top: 0.6rem;
    background: var(--bg);
    border-left: 4px solid var(--accent);
    border-radius: 0.5rem;
  }
  .error { color: #b05a72; min-height: 1.2rem; margin: 0.6rem 0 0; }
  #app[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>🔒 비밀 메모장</h1>

  <section id="lock">
    <p>비밀번호를 입력하세요.</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="비밀번호" required>
      <button type="submit">잠금 해제</button>
    </form>
    <p class="error" id="error"></p>
  </section>

  <section id="app" hidden>
    <form id="memoForm">
      <textarea id="memo" placeholder="메모를 입력하세요" required></textarea>
    </form>
    <button type="submit" form="memoForm">저장</button>
    <div id="list"></div>
  </section>
</main>
<script>
  const PASSWORD = '1234';

  document.getElementById('loginForm').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('pw').value;
    const ok = input === PASSWORD;
    console.log('비밀번호 확인:', input, '/ 정답:', PASSWORD, '/ 결과:', ok);
    if (ok) {
      document.getElementById('lock').hidden = true;
      document.getElementById('app').hidden = false;
    } else {
      document.getElementById('error').textContent = '비밀번호가 틀렸습니다.';
    }
  };

  document.getElementById('memoForm').onsubmit = e => {
    e.preventDefault();
    const memo = document.getElementById('memo');
    const div = document.createElement('div');
    div.className = 'memo';
    div.innerHTML = memo.value;
    document.getElementById('list').append(div);
    memo.value = '';
    memo.focus();
  };
</script>
</body>
</html>
