<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀 메모장</title>
<style>
  :root {
    --bg: #f5f3fa;
    --card: #ffffff;
    --accent: #cdbde8;
    --text: #423d4d;
    --line: #e8e2f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    max-width: 30rem;
    margin: 0 auto;
    background: var(--card);
    border-radius: 1.25rem;
    padding: 1.75rem;
    box-shadow: 0 0.5rem 1.5rem rgba(150, 135, 175, 0.15);
  }
  h1 { margin: 0 0 1.25rem; font-size: 1.4rem; }
  form { display: flex; gap: 0.5rem; }
  input, textarea {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    font: inherit;
    color: inherit;
    background: var(--bg);
  }
  textarea { resize: vertical; min-height: 4.5rem; width: 100%; }
  button {
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 0.75rem;
    background: var(--accent);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.96); }
  .memo {
    padding: 0.8rem 1rem;
    margin-top: 0.6rem;
    background: var(--bg);
    border-left: 4px solid var(--accent);
    border-radius: 0.5rem;
    white-space: pre-wrap;
  }
  .error { color: #b05a72; min-height: 1.2rem; margin: 0.6rem 0 0; }
  #app[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>🔒 비밀 메모장</h1>

  <section id="lock">
    <p id="prompt">비밀번호를 입력하세요.</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="비밀번호" required>
      <button type="submit" id="submit">잠금 해제</button>
    </form>
    <p class="error" id="error"></p>
  </section>

  <section id="app" hidden>
    <form id="memoForm">
      <textarea id="memo" placeholder="메모를 입력하세요" required></textarea>
    </form>
    <button type="submit" form="memoForm">저장</button>
    <div id="list"></div>
  </section>
</main>
<script>
  // ponytail: salt 없는 SHA-256 + localStorage. 클라이언트 전용이라 여기까지가 한계 —
  // 실제 인증이 필요해지면 서버에서 검증하고 argon2/bcrypt로 저장할 것.
  const KEY = 'secret-memo-pw';
  const pw = document.getElementById('pw');
  const error = document.getElementById('error');
  const isFirstRun = () => localStorage.getItem(KEY) === null;

  async function hash(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const digest = await hash(pw.value);
    if (isFirstRun()) {
      localStorage.setItem(KEY, digest);
    } else if (digest !== localStorage.getItem(KEY)) {
      error.textContent = '비밀번호가 틀렸습니다.';
      pw.value = '';
      return;
    }
    pw.value = '';
    document.getElementById('lock').hidden = true;
    document.getElementById('app').hidden = false;
  };

  document.getElementById('memoForm').onsubmit = e => {
    e.preventDefault();
    const memo = document.getElementById('memo');
    const div = document.createElement('div');
    div.className = 'memo';
    div.textContent = memo.value;
    document.getElementById('list').append(div);
    memo.value = '';
    memo.focus();
  };

  if (isFirstRun()) {
    document.getElementById('prompt').textContent = '처음 사용하시네요. 사용할 비밀번호를 정하세요.';
    document.getElementById('submit').textContent = '비밀번호 설정';
  }
</script>
</body>
</html>
