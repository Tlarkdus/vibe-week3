<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>김바이브 | 개발자의 창</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #ffe4ec 0%, #e4f0ff 50%, #e8ffe4 100%);
      color: #5a5560;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fffdfa;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(180, 160, 200, 0.18);
      text-align: center;
    }
    img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ffeaf2;
    }
    h1 {
      margin: 20px 0 8px;
      font-size: 28px;
      color: #7a6a8a;
    }
    .intro {
      margin: 0 0 28px;
      color: #6f6878;
    }
    h2 {
      font-size: 16px;
      color: #7a6a8a;
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #f3ecff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .moods {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .moods button {
      font-size: 26px;
      line-height: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 14px;
      background: #f3ecff;
      cursor: pointer;
    }
    .moods button:hover {
      background: #e8dcff;
    }
    #mood-msg {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: #6f6878;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://placehold.co/280x280/ffeaf2/c9a7d6?text=%3A%29" alt="김바이브 프로필 이미지">
    <h1>김바이브</h1>
    <p class="intro">코드와 커피, 로파이가 있으면 하루가 완성돼요.</p>
    <h2>좋아하는 것 3가지</h2>
    <ul>
      <li>🌸 파스텔 색 조합</li>
      <li>☕ 아침의 첫 커피</li>
      <li>🎧 잔잔한 로파이 음악</li>
    </ul>
    <h2>오늘 하루는 어떤 기분?</h2>
    <div class="moods">
      <button type="button" aria-label="기분 좋음" data-msg="좋은 흐름이에요. 그 기세 그대로 하루를 채워봐요 ✨">😊</button>
      <button type="button" aria-label="기분 그저 그럼" data-msg="애매한 날도 하루예요. 커피 한 잔하고 천천히 가요 ☕">😐</button>
      <button type="button" aria-label="기분 지침" data-msg="오늘은 잘 쉬는 게 일이에요. 내일의 나에게 넘겨도 괜찮아요 🌙">😮‍💨</button>
    </div>
    <p id="mood-msg" role="status"></p>
  </div>
  <script>
    document.querySelector('.moods').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (btn) document.getElementById('mood-msg').textContent = btn.dataset.msg;
    });
  </script>
</body>
</html>
