<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>심가연 | 개발자의 창</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // 화면이 그려지기 전에 테마를 정해야 새로고침 때 흰 화면이 번쩍이지 않는다
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <style>
    :root {
      --bg: linear-gradient(135deg, #ffe4ec 0%, #e4f0ff 50%, #e8ffe4 100%);
      --card: #fffdfa;
      --text: #6f6878;
      --head: #7a6a8a;
      --chip: #f3ecff;
      --chip-hover: #e8dcff;
      --chip-on: #d9c7ff;
      --shadow: rgba(180, 160, 200, 0.18);
      --ring: linear-gradient(135deg, #ffb3d1, #a9c8ff, #b8f0c4);
    }
    :root[data-theme="dark"] {
      --bg: linear-gradient(135deg, #2b2333 0%, #232a38 50%, #23322c 100%);
      --card: #2f2839;
      --text: #cfc7d8;
      --head: #ddcaf2;
      --chip: #3c3452;
      --chip-hover: #4a3f66;
      --chip-on: #5a4b7d;
      --shadow: rgba(0, 0, 0, 0.35);
      --ring: linear-gradient(135deg, #ff8fc0, #7fa8ff, #6fe0a0);
    }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
    }
    .card {
      position: relative;
      max-width: 420px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 24px var(--shadow);
      text-align: center;
    }
    /* 카드 뒤로 2px 삐져나오게 깔아 그라데이션 테두리처럼 보이게 한다 */
    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: var(--ring);
      z-index: -1;
    }
    img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--chip);
    }
    h1 {
      margin: 20px 0 8px;
      font-size: 28px;
      color: var(--head);
    }
    .intro {
      margin: 0 0 28px;
      color: var(--text);
    }
    h2 {
      font-size: 16px;
      color: var(--head);
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: var(--chip);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .moods {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 14px;
      background: var(--chip);
      color: inherit;
      cursor: pointer;
    }
    .moods button {
      font-size: 26px;
      line-height: 1;
      padding: 10px 14px;
    }
    /* 터치 기기는 hover가 마지막 버튼에 고착되므로 마우스 환경에서만 적용 */
    @media (hover: hover) {
      button:hover {
        background: var(--chip-hover);
      }
    }
    button:active,
    .moods button[aria-pressed="true"] {
      background: var(--chip-on);
    }
    button:focus-visible {
      outline: 3px solid var(--head);
      outline-offset: 2px;
    }
    #mood-msg {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: var(--text);
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    .links a {
      background: var(--chip);
      border-radius: 14px;
      padding: 10px 16px;
      color: var(--head);
      text-decoration: none;
    }
    @media (hover: hover) {
      .links a:hover {
        background: var(--chip-hover);
      }
    }
    .links a:focus-visible {
      outline: 3px solid var(--head);
      outline-offset: 2px;
    }
    .floaties {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }
    .floaties span {
      position: absolute;
      left: var(--x);
      bottom: -80px;
      font-size: var(--s, 28px);
      opacity: 0.35;
      animation: rise var(--t) linear var(--d) infinite;
    }
    @keyframes rise {
      to {
        transform: translate(20px, -110vh) rotate(24deg);
      }
    }
    /* 움직임에 민감한 사용자에겐 배경을 아예 띄우지 않는다 */
    @media (prefers-reduced-motion: reduce) {
      .floaties {
        display: none;
      }
    }
    .spark {
      position: fixed;
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      animation: spark 0.7s ease-out forwards;
    }
    @keyframes spark {
      to {
        transform: translate(-50%, -70px) scale(0.4);
        opacity: 0;
      }
    }
    #theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 20px;
      line-height: 1;
      padding: 10px 12px;
      box-shadow: 0 4px 12px var(--shadow);
    }
  </style>
</head>
<body>
  <!-- 장식용이라 스크린리더에서는 통째로 숨긴다 -->
  <div class="floaties" aria-hidden="true">
    <span style="--x:6%;  --d:0s;   --t:22s; --s:30px">☕</span>
    <span style="--x:20%; --d:7s;   --t:27s; --s:22px">🐱</span>
    <span style="--x:34%; --d:3s;   --t:19s; --s:26px">🍜</span>
    <span style="--x:48%; --d:12s;  --t:25s; --s:20px">☕</span>
    <span style="--x:62%; --d:5s;   --t:30s; --s:32px">🐱</span>
    <span style="--x:76%; --d:15s;  --t:21s; --s:24px">🍜</span>
    <span style="--x:88%; --d:9s;   --t:26s; --s:28px">☕</span>
    <span style="--x:13%; --d:18s;  --t:24s; --s:20px">🍜</span>
    <span style="--x:69%; --d:21s;  --t:28s; --s:22px">🐱</span>
  </div>
  <button type="button" id="theme-toggle" aria-pressed="false" aria-label="다크모드 켜기">🌙</button>
  <div class="card">
    <img src="https://placehold.co/280x280/ffeaf2/c9a7d6?text=%3A%29" alt="심가연 프로필 이미지">
    <h1>심가연</h1>
    <p class="intro">데이터사이언스전공 · 23학번</p>
    <h2>좋아하는 것 3가지</h2>
    <!-- list-style:none을 쓰면 Safari가 목록으로 노출하지 않아 role을 명시한다 -->
    <ul role="list">
      <li>☕ 커피</li>
      <li>🐱 고양이</li>
      <li>🍜 라멘</li>
    </ul>
    <h2>오늘 하루는 어떤 기분?</h2>
    <div class="moods">
      <button type="button" aria-pressed="false" aria-label="기분 좋음" data-msg="좋은 흐름이에요. 그 기세 그대로 하루를 채워봐요 ✨">😊</button>
      <button type="button" aria-pressed="false" aria-label="기분 그저 그럼" data-msg="애매한 날도 하루예요. 커피 한 잔하고 천천히 가요 ☕">😐</button>
      <button type="button" aria-pressed="false" aria-label="기분 지침" data-msg="오늘은 잘 쉬는 게 일이에요. 내일의 나에게 넘겨도 괜찮아요 🌙">😮‍💨</button>
    </div>
    <p id="mood-msg" role="status"></p>
    <nav class="links" aria-label="바로가기">
      <a href="https://github.com/Tlarkdus">🐙 GitHub</a>
    </nav>
  </div>
  <script>
    var motionOK = !matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 화면 좌표에 이모지 하나를 띄웠다가 애니메이션이 끝나면 스스로 지운다
    function spark(x, y, char, size) {
      if (!motionOK) return;
      var s = document.createElement('span');
      s.className = 'spark';
      s.textContent = char;
      s.style.cssText = 'left:' + x + 'px; top:' + y + 'px; font-size:' + size + 'px';
      s.addEventListener('animationend', function () { s.remove(); });
      document.body.appendChild(s);
    }

    var moods = document.querySelector('.moods');
    moods.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      moods.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      document.getElementById('mood-msg').textContent = btn.dataset.msg;
      var r = btn.getBoundingClientRect();
      spark(r.left + r.width / 2, r.top, btn.textContent, 30);
    });

    // 커서 반짝임은 마우스가 있는 환경에서만, 90ms 간격으로만 만든다
    if (matchMedia('(hover: hover)').matches) {
      var lastSpark = 0;
      addEventListener('mousemove', function (e) {
        if (e.timeStamp - lastSpark < 90) return;
        lastSpark = e.timeStamp;
        spark(e.clientX, e.clientY, '✨', 14);
      });
    }

    var toggle = document.getElementById('theme-toggle');
    function paintToggle() {
      var dark = document.documentElement.dataset.theme === 'dark';
      toggle.textContent = dark ? '☀️' : '🌙';
      toggle.setAttribute('aria-pressed', String(dark));
      toggle.setAttribute('aria-label', dark ? '라이트모드 켜기' : '다크모드 켜기');
    }
    toggle.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      paintToggle();
    });
    paintToggle();
  </script>
</body>
</html>
