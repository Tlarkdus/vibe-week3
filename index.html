<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>심가연 | 개발자의 창</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // 화면이 그려지기 전에 테마를 정해야 새로고침 때 흰 화면이 번쩍이지 않는다
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <style>
    :root {
      --bg: linear-gradient(135deg, #ffe4ec 0%, #e4f0ff 50%, #e8ffe4 100%);
      --card: #fffdfa;
      --text: #6f6878;
      --head: #7a6a8a;
      --chip: #f3ecff;
      --chip-hover: #e8dcff;
      --chip-on: #d9c7ff;
      --shadow: rgba(180, 160, 200, 0.18);
    }
    :root[data-theme="dark"] {
      --bg: linear-gradient(135deg, #2b2333 0%, #232a38 50%, #23322c 100%);
      --card: #2f2839;
      --text: #cfc7d8;
      --head: #ddcaf2;
      --chip: #3c3452;
      --chip-hover: #4a3f66;
      --chip-on: #5a4b7d;
      --shadow: rgba(0, 0, 0, 0.35);
    }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 24px var(--shadow);
      text-align: center;
    }
    img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--chip);
    }
    h1 {
      margin: 20px 0 8px;
      font-size: 28px;
      color: var(--head);
    }
    .intro {
      margin: 0 0 28px;
      color: var(--text);
    }
    h2 {
      font-size: 16px;
      color: var(--head);
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: var(--chip);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .moods {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 14px;
      background: var(--chip);
      color: inherit;
      cursor: pointer;
    }
    .moods button {
      font-size: 26px;
      line-height: 1;
      padding: 10px 14px;
    }
    /* 터치 기기는 hover가 마지막 버튼에 고착되므로 마우스 환경에서만 적용 */
    @media (hover: hover) {
      button:hover {
        background: var(--chip-hover);
      }
    }
    button:active,
    .moods button[aria-pressed="true"] {
      background: var(--chip-on);
    }
    button:focus-visible {
      outline: 3px solid var(--head);
      outline-offset: 2px;
    }
    #mood-msg {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: var(--text);
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    .links a {
      background: var(--chip);
      border-radius: 14px;
      padding: 10px 16px;
      color: var(--head);
      text-decoration: none;
    }
    @media (hover: hover) {
      .links a:hover {
        background: var(--chip-hover);
      }
    }
    .links a:focus-visible {
      outline: 3px solid var(--head);
      outline-offset: 2px;
    }
    #theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 20px;
      line-height: 1;
      padding: 10px 12px;
      box-shadow: 0 4px 12px var(--shadow);
    }
  </style>
</head>
<body>
  <button type="button" id="theme-toggle" aria-pressed="false" aria-label="다크모드 켜기">🌙</button>
  <div class="card">
    <img src="https://placehold.co/280x280/ffeaf2/c9a7d6?text=%3A%29" alt="심가연 프로필 이미지">
    <h1>심가연</h1>
    <p class="intro">코드와 커피, 로파이가 있으면 하루가 완성돼요.</p>
    <h2>좋아하는 것 3가지</h2>
    <!-- list-style:none을 쓰면 Safari가 목록으로 노출하지 않아 role을 명시한다 -->
    <ul role="list">
      <li>🌸 파스텔 색 조합</li>
      <li>☕ 아침의 첫 커피</li>
      <li>🎧 잔잔한 로파이 음악</li>
    </ul>
    <h2>오늘 하루는 어떤 기분?</h2>
    <div class="moods">
      <button type="button" aria-pressed="false" aria-label="기분 좋음" data-msg="좋은 흐름이에요. 그 기세 그대로 하루를 채워봐요 ✨">😊</button>
      <button type="button" aria-pressed="false" aria-label="기분 그저 그럼" data-msg="애매한 날도 하루예요. 커피 한 잔하고 천천히 가요 ☕">😐</button>
      <button type="button" aria-pressed="false" aria-label="기분 지침" data-msg="오늘은 잘 쉬는 게 일이에요. 내일의 나에게 넘겨도 괜찮아요 🌙">😮‍💨</button>
    </div>
    <p id="mood-msg" role="status"></p>
    <nav class="links" aria-label="바로가기">
      <a href="https://github.com/Tlarkdus">🐙 GitHub</a>
    </nav>
  </div>
  <script>
    var moods = document.querySelector('.moods');
    moods.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      moods.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      document.getElementById('mood-msg').textContent = btn.dataset.msg;
    });

    var toggle = document.getElementById('theme-toggle');
    function paintToggle() {
      var dark = document.documentElement.dataset.theme === 'dark';
      toggle.textContent = dark ? '☀️' : '🌙';
      toggle.setAttribute('aria-pressed', String(dark));
      toggle.setAttribute('aria-label', dark ? '라이트모드 켜기' : '다크모드 켜기');
    }
    toggle.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      paintToggle();
    });
    paintToggle();
  </script>
</body>
</html>
